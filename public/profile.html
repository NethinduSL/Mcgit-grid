<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffc900">
<title>Profile · MCG IT Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc900'/%3E%3Crect x='12' y='12' width='18' height='18' rx='3' fill='%23111'/%3E%3Crect x='34' y='12' width='18' height='18' rx='3' fill='%23111' opacity='.35'/%3E%3Crect x='12' y='34' width='18' height='18' rx='3' fill='%23111' opacity='.35'/%3E%3Crect x='34' y='34' width='18' height='18' rx='3' fill='%23111'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="app.js"></script>
</head>
<body>
<div class="nav" id="nav"></div>
<div class="wrap" style="max-width:680px">
  <h1 class="title"><i class="fa-solid fa-user"></i> My Profile</h1><p class="sub">Manage your account</p>
  <div class="card phead" id="head"></div>
  <div class="card"><h2><i class="fa-solid fa-id-card"></i> Details</h2>
    <div class="field"><label>Name</label><input id="name"></div>
    <div id="gradebox"></div>
    <button class="btn" type="button" id="sv" onclick="save()"><i class="fa-solid fa-floppy-disk"></i> Save changes</button></div>
  <div class="card"><h2><i class="fa-solid fa-lock"></i> Change password</h2>
    <div class="field"><label>New password (6+ characters)</label><input id="pw" type="password"></div>
    <button class="btn dark" type="button" onclick="pass()"><i class="fa-solid fa-key"></i> Update password</button></div>
  <div class="card"><h2><i class="fa-solid fa-circle-half-stroke"></i> Appearance</h2>
    <div class="meta" style="margin-bottom:12px">Switch between light and dark mode.</div>
    <button class="btn dark" type="button" onclick="toggleTheme()"><i class="fa-solid theme-ic fa-moon"></i> Switch theme</button></div>
  <button class="btn danger" type="button" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</div>
<div class="toast" id="toast"></div>
<script>
if (guard()) { renderNav('profile'); fill(); }
function fill() {
  $('head').innerHTML = `<div class="avatar">${esc(initials(me.name))}</div><div><h2>${esc(me.name)}</h2>
    <span class="badge y"><i class="fa-solid ${me.role === 'teacher' ? 'fa-chalkboard-user' : 'fa-user-graduate'}"></i> ${me.role}</span>
    ${me.grade ? `<span class="badge">${esc(me.grade)}</span>` : ''}${me.no ? `<span class="badge">No. ${esc(me.no)}</span>` : ''}</div>`;
  $('name').value = me.name;
  $('gradebox').innerHTML = me.role === 'teacher' ? '' : gradeFields('p', me.grade) + `<div class="field"><label>Class number</label><input id="no" type="number" min="1" value="${esc(me.no)}"></div>`;
  syncTheme();
}
async function save() {
  const btn = $('sv'); busy(btn, true, 'Saving');
  try { saveSession(await api('updateProfile', { name: val('name'), grade: me.role === 'teacher' ? (me.grade || '') : readGrade('p'), no: me.role === 'teacher' ? '' : val('no') })); fill(); toast('Profile saved ✔'); }
  catch (e) { toast(e.message, true); }
  busy(btn, false);
}
async function pass() {
  try { await api('changePassword', { password: val('pw') }); $('pw').value = ''; toast('Password updated ✔'); }
  catch (e) { toast(e.message, true); }
}
</script></body></html>
