<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffc900">
<title>Dashboard · MCG IT Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc900'/%3E%3Crect x='12' y='12' width='18' height='18' rx='3' fill='%23111'/%3E%3Crect x='34' y='12' width='18' height='18' rx='3' fill='%23111' opacity='.35'/%3E%3Crect x='12' y='34' width='18' height='18' rx='3' fill='%23111' opacity='.35'/%3E%3Crect x='34' y='34' width='18' height='18' rx='3' fill='%23111'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="app.js"></script>
</head>
<body>
<div class="nav" id="nav"></div>
<div class="wrap">
  <h1 class="title"><i class="fa-solid fa-chalkboard-user"></i> Teacher Dashboard</h1>
  <p class="sub">Post homework, check students' work, give marks and download mark sheets</p>
  <div class="seg" id="tabs">
    <button type="button" data-t="hw" onclick="show('hw')"><i class="fa-solid fa-list-check"></i> Homework</button>
    <button type="button" data-t="st" onclick="show('st')"><i class="fa-solid fa-user-graduate"></i> Students</button>
    <button type="button" data-t="mk" onclick="show('mk')"><i class="fa-solid fa-file-excel"></i> Mark sheet</button>
  </div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>
<script>
let tab = 'hw', hws = [], studs = [], tg = new Set(), pk = null, ms = null;
const gk = g => String(g || '').toUpperCase().replace(/\s+/g, '').replace(/^GRADE/, '');
const sees = (h, g) => { const t = h.targets; if (!t || !t.length) return true; const k = gk(g); return t.some(x => x === k || x === k.split('-')[0]); };
const tlabel = h => !h.targets || !h.targets.length ? 'All classes' : h.targets.map(t => t.includes('-') ? 'Grade ' + t : 'Grade ' + t + ' (all)').join(', ');
const relevant = (h, g, s) => {
  if (!h.targets || !h.targets.length) return true;
  return h.targets.some(t => s ? t === g + '-' + s || t === g : t === g || t.startsWith(g + '-'));
};
const matchClass = (u, g, s) => { const p = parseGrade(u.grade); return (!g || p.g === g) && (!s || p.s === s); };
const gradeList = () => [...new Set([...GRADES.map(String), ...studs.map(u => parseGrade(u.grade).g).filter(Boolean)])].sort((a, b) => a - b);
const classSel = (p, fn, g, s) => `<div class="field"><label>Grade</label><select id="${p}g" onchange="${fn}">
  <option value="">All grades</option>${gradeList().map(x => `<option value="${x}" ${x === g ? 'selected' : ''}>Grade ${x}</option>`).join('')}</select></div>
  <div class="field"><label>Section</label><select id="${p}s" onchange="${fn}">
  <option value="">All sections</option>${SECTIONS.map(x => `<option value="${x}" ${x === s ? 'selected' : ''}>${x}</option>`).join('')}</select></div>`;

if (guard('teacher')) { renderNav('admin'); boot(); }
async function boot() {
  $('view').innerHTML = skeleton(3);
  try {
    const [a, b] = await Promise.all([api('homeworks'), api('students')]);
    hws = a.homeworks; studs = b.students;
    show('hw');
  } catch (e) { $('view').innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>' + esc(e.message) + '</div>'; }
}
function show(t) {
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'hw') viewHw(); else if (t === 'st') viewStudents(); else viewMarks();
}
async function refresh() { const [a, b] = await Promise.all([api('homeworks'), api('students')]); hws = a.homeworks; studs = b.students; }

function viewHw() {
  $('view').innerHTML = `
  <div class="card"><h2><i class="fa-solid fa-plus"></i> New homework</h2>
    <div class="row"><div class="field"><label>Title</label><input id="t"></div>
    <div class="field"><label>Due date</label><input id="due" type="date"></div></div>
    <div class="row"><div class="field"><label>Total marks <small style="font-weight:400;opacity:.7">(optional)</small></label><input id="total" type="number" min="0" placeholder="e.g. 20"></div><div></div></div>
    <div class="field"><label>Description</label><textarea id="d" rows="3"></textarea></div>
    <div class="field"><label>Images (up to 5)</label><div id="pk"></div></div>
    <div class="field"><label>Send to</label><div id="tg"></div><div class="meta" id="tsum" style="margin-top:8px"></div></div>
    <button class="btn" type="button" id="addb" onclick="add()"><i class="fa-solid fa-plus"></i> Create homework</button></div>
  <h2 class="sec"><i class="fa-solid fa-list-check"></i> All homework</h2>
  <div class="toolbar">${classSel('f', 'drawList()', '', '')}<div class="field" style="flex:2"></div></div>
  <div id="list"></div>`;
  tg = new Set(); pk = makePicker($('pk'), { max: 5 }); drawTargets(); drawList();
}
function drawTargets() {
  const all = tg.size === 0;
  $('tg').innerHTML = '<div class="tgrid"><div class="trow"><span class="gl">Everyone</span><button type="button" class="chip all ' + (all ? 'on' : '') + '" onclick="tAll()">All classes</button></div>' +
    GRADES.map(g => {
      const whole = tg.has(String(g));
      return `<div class="trow"><span class="gl">Grade ${g}</span><button type="button" class="chip all ${whole ? 'on' : ''}" onclick="tGrade('${g}')">Whole grade</button>` +
        SECTIONS.map(s => `<button type="button" class="chip ${whole || tg.has(g + '-' + s) ? 'on' : ''} ${whole ? 'dim' : ''}" onclick="tSec('${g}','${s}')">${g}-${s}</button>`).join('') + '</div>';
    }).join('') + '</div>';
  $('tsum').innerHTML = all ? '<i class="fa-solid fa-people-group"></i> Everyone will see this homework' : '<i class="fa-solid fa-people-group"></i> Will be sent to: ' + esc([...tg].sort().map(t => t.includes('-') ? t : 'Grade ' + t + ' (all)').join(', '));
}
function tAll() { tg.clear(); drawTargets(); }
function tGrade(g) {
  if (tg.has(g)) tg.delete(g);
  else { SECTIONS.forEach(s => tg.delete(g + '-' + s)); tg.add(g); }
  drawTargets();
}
function tSec(g, s) {
  const k = g + '-' + s;
  if (tg.has(g)) { tg.delete(g); SECTIONS.forEach(x => { if (x !== s) tg.add(g + '-' + x); }); }
  else if (tg.has(k)) tg.delete(k);
  else { tg.add(k); if (SECTIONS.every(x => tg.has(g + '-' + x))) { SECTIONS.forEach(x => tg.delete(g + '-' + x)); tg.add(g); } }
  drawTargets();
}
async function add() {
  const btn = $('addb');
  if (!val('t')) { toast('Title required', true); return; }
  busy(btn, true, pk.count() ? 'Uploading images' : 'Creating');
  try {
    const images = await pk.upload();
    await api('createHomework', { title: val('t'), description: val('d'), due: val('due'), total: val('total'), images, targets: [...tg] });
    toast('Homework created ✔');
    await refresh(); viewHw();
  } catch (e) { toast(e.message, true); busy(btn, false); }
}
function drawList() {
  const g = $('fg') ? $('fg').value : '', s = $('fs') ? $('fs').value : '';
  const shown = hws.filter(h => !g || relevant(h, g, s));
  $('list').innerHTML = shown.map(h => {
    const exp = studs.filter(u => sees(h, u.grade)).length;
    return `<div class="card hw"><div class="ic"><i class="fa-solid fa-laptop-code"></i></div><div class="body">
      <h3>${esc(h.title)}</h3>
      <div class="meta"><span><i class="fa-regular fa-calendar"></i> Due ${fmt(h.due)}</span>
        <span class="badge"><i class="fa-solid fa-people-group"></i> ${esc(tlabel(h))}</span>
        ${h.total ? `<span class="badge">${h.total} marks</span>` : ''}
        <span class="badge">${exp} student${exp === 1 ? '' : 's'}</span></div>
      <p>${esc(h.description)}</p>${gallery(h.images)}
      <button class="btn sm" type="button" onclick="subs('${h.id}')"><i class="fa-solid fa-inbox"></i> Submissions</button>
      <button class="btn sm danger" type="button" onclick="del('${h.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
      <div id="s-${h.id}"></div></div></div>`;
  }).join('') || '<div class="empty"><i class="fa-regular fa-folder-open"></i>No homework yet</div>';
  hydrate($('list'));
}
async function del(id) {
  if (!confirm('Delete this homework?')) return;
  try { await api('deleteHomework', { id }); toast('Deleted'); await refresh(); drawList(); }
  catch (e) { toast(e.message, true); }
}
function subCard(s, total) {
  return `<div class="sublist"><div class="who"><i class="fa-solid fa-user-graduate"></i> ${esc(s.name || 'Unknown')} <span class="badge">${esc(s.grade)}</span>
      ${s.marks != null ? `<span class="badge ok">${s.marks}${total ? ' / ' + total : ''}</span>` : '<span class="badge y">Not graded</span>'}</div>
    ${s.answer ? `<p style="margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(s.answer)}</p>` : ''}
    ${/^https?:\/\//i.test(s.link || '') ? `<a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--y2);font-weight:600"><i class="fa-solid fa-link"></i> Open link</a>` : ''}
    ${gallery(s.images)}
    <div class="meta" style="margin:6px 0">Submitted ${fmt(s.submittedAt)}</div>
    <div class="grade-row"><input id="m-${s.id}" type="number" placeholder="Marks" value="${s.marks ?? ''}">
      <input id="f-${s.id}" placeholder="Feedback" value="${esc(s.feedback)}">
      <button class="btn sm dark" type="button" onclick="grade('${s.id}')"><i class="fa-solid fa-check"></i> Save</button></div></div>`;
}
async function subs(id) {
  const box = $('s-' + id);
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = skeleton(1);
  try {
    const { submissions } = await api('submissions', { homeworkId: id });
    const h = hws.find(x => x.id === id), done = new Set(submissions.map(s => s.studentId));
    const missing = studs.filter(u => sees(h, u.grade) && !done.has(u.id));
    box.innerHTML = `<div style="margin:12px 0 4px;font-weight:600">${submissions.length} submission(s)</div>` +
      (missing.length ? `<div class="meta" style="margin-bottom:6px"><i class="fa-regular fa-clock"></i> Not submitted yet (${missing.length}): ${esc(missing.map(u => u.name + ' ' + u.grade).join(', '))}</div>` : '') +
      submissions.map(s => subCard(s, h && h.total)).join('');
    hydrate(box);
  } catch (e) { box.innerHTML = ''; toast(e.message, true); }
}
async function grade(id) {
  try { await api('grade', { id, marks: $('m-' + id).value, feedback: $('f-' + id).value }); toast('Marks saved ✔'); }
  catch (e) { toast(e.message, true); }
}

function viewStudents() {
  $('view').innerHTML = `<div class="toolbar">${classSel('sf', 'drawStudents()', '', '')}
    <div class="field" style="flex:2"><label>Search name</label><input id="q" placeholder="Type a name" oninput="drawStudents()"></div></div>
    <div id="slist"></div>`;
  drawStudents();
}
function drawStudents() {
  const g = $('sfg').value, s = $('sfs').value, q = $('q').value.trim().toLowerCase();
  const list = studs.filter(u => matchClass(u, g, s) && (!q || (u.name || '').toLowerCase().includes(q))).sort((a, b) => String(a.grade).localeCompare(String(b.grade), undefined, { numeric: true }) || (+a.no || 0) - (+b.no || 0) || String(a.name).localeCompare(b.name));
  $('slist').innerHTML = list.length ? `<div class="tscroll"><table class="tbl"><thead><tr><th>Name</th><th>Class</th><th>No.</th><th>Submitted</th></tr></thead><tbody>` +
    list.map(u => `<tr onclick="openStudent('${u.id}')"><td><b>${esc(u.name)}</b></td><td><span class="badge">${esc(u.grade || '-')}</span></td><td>${esc(u.no || '-')}</td><td>${u.submitted}</td></tr>`).join('') + '</tbody></table></div>'
    : '<div class="empty"><i class="fa-solid fa-user-slash"></i>No students found</div>';
}
async function openStudent(id) {
  $('view').innerHTML = skeleton(2);
  try {
    const { student, items } = await api('studentWork', { studentId: id });
    $('view').innerHTML = `<button class="btn sm ghost back" type="button" onclick="show('st')"><i class="fa-solid fa-arrow-left"></i> All students</button>
      <div class="card phead"><div class="avatar">${esc(initials(student.name))}</div><div><h2>${esc(student.name)}</h2>
        <span class="badge y"><i class="fa-solid fa-user-graduate"></i> student</span> <span class="badge">${esc(student.grade || '-')}</span>
        <span class="badge">No. ${esc(student.no || '-')}</span></div></div>
      <h2 class="sec"><i class="fa-solid fa-list-check"></i> Homework (${items.length})</h2>` +
      (items.map(({ homework: h, submission: s }) => `<div class="card hw"><div class="ic"><i class="fa-solid fa-laptop-code"></i></div><div class="body">
        <h3>${esc(h.title)}</h3>
        <div class="meta"><span><i class="fa-regular fa-calendar"></i> Due ${fmt(h.due)}</span>${h.total ? `<span class="badge">${h.total} marks</span>` : ''}
          <span class="badge ${s ? 'ok' : 'late'}">${s ? 'Submitted' : 'Not submitted'}</span></div>
        <p>${esc(h.description)}</p>${gallery(h.images)}
        ${s ? subCard({ ...s, name: student.name, grade: student.grade }, h.total) : ''}</div></div>`).join('') || '<div class="empty"><i class="fa-regular fa-folder-open"></i>No homework for this student</div>');
    hydrate($('view'));
  } catch (e) { toast(e.message, true); show('st'); }
}

async function viewMarks() {
  $('view').innerHTML = skeleton(2);
  try { ms = await api('marksSheet'); } catch (e) { $('view').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  $('view').innerHTML = `<div class="card"><h2><i class="fa-solid fa-file-excel"></i> Mark sheet</h2>
    <div class="toolbar">${classSel('mf', 'drawMarks()', '', '')}
      <div class="field" style="flex:2"><label>Homework</label><select id="mh" onchange="drawMarks()"><option value="">All homework</option>${ms.homeworks.slice().reverse().map(h => `<option value="${h.id}">${esc(h.title)}</option>`).join('')}</select></div></div>
    <div class="meta" id="msum" style="margin-bottom:12px"></div>
    <button class="btn" type="button" id="xl" onclick="download()"><i class="fa-solid fa-download"></i> Download Excel (.xlsx)</button></div>
    <div id="mtable"></div>`;
  drawMarks();
}
function buildSheet() {
  const g = $('mfg').value, s = $('mfs').value, mh = $('mh').value;
  const list = ms.students.filter(u => matchClass(u, g, s)).sort((a, b) => String(a.grade).localeCompare(String(b.grade), undefined, { numeric: true }) || (+a.no || 0) - (+b.no || 0));
  const hs = ms.homeworks.filter(h => (!mh || h.id === mh) && list.some(u => sees(h, u.grade)));
  const idx = new Map(ms.submissions.map(x => [x.homeworkId + '|' + x.studentId, x]));
  const head = ['No', 'Name', 'Class', 'Class No', ...hs.map(h => h.title + (h.total ? ' (/' + h.total + ')' : '')), 'Total', 'Submitted'];
  const rows = list.map((u, i) => {
    let tot = 0, n = 0;
    const cells = hs.map(h => {
      if (!sees(h, u.grade)) return '-';
      const x = idx.get(h.id + '|' + u.id);
      if (!x) return 'Not submitted';
      n++;
      if (x.marks == null) return 'Submitted';
      tot += x.marks; return x.marks;
    });
    return [i + 1, u.name, u.grade || '', u.no || '', ...cells, tot, n];
  });
  return { head, rows, students: list.length, hws: hs.length };
}
function drawMarks() {
  const { head, rows, students, hws: hn } = buildSheet();
  $('msum').innerHTML = `<i class="fa-solid fa-users"></i> ${students} student(s) · <i class="fa-solid fa-book"></i> ${hn} homework`;
  $('mtable').innerHTML = rows.length ? `<div class="tscroll"><table class="tbl"><thead><tr>${head.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(r => `<tr style="cursor:default">${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>'
    : '<div class="empty"><i class="fa-solid fa-table"></i>No students for this selection</div>';
}
function loadXlsx() {
  return window.XLSX ? Promise.resolve() : new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => no(new Error('Could not load the Excel library. Check your internet connection.'));
    document.head.appendChild(s);
  });
}
async function download() {
  const btn = $('xl'); busy(btn, true, 'Preparing');
  try {
    await loadXlsx();
    const { head, rows } = buildSheet();
    if (!rows.length) throw new Error('No students for this selection');
    const ws = XLSX.utils.aoa_to_sheet([head, ...rows]);
    ws['!cols'] = head.map((h, i) => ({ wch: i === 1 ? 26 : i === 3 ? 10 : Math.max(10, Math.min(30, String(h).length + 2)) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Marks');
    const g = $('mfg').value, s = $('mfs').value;
    XLSX.writeFile(wb, 'marks' + (g ? '-grade' + g + (s ? s : '') : '-all') + '-' + new Date().toISOString().slice(0, 10) + '.xlsx');
    toast('Excel file downloaded ✔');
  } catch (e) { toast(e.message, true); }
  busy(btn, false);
}
</script></body></html>
