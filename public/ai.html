<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffc900">
  <title>AI Helper · MCG ICT Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="bitx.css">
  <link rel="icon" type="image/svg+xml" href="logos/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="logos/favicon-32.png">
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('lms_theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root{
      --y:#ffc900;--y2:#e6b400;--yt:rgba(255,201,0,.14);--yl:rgba(255,201,0,.4);
      --bg:#f5f5f2;--bg2:#ecece7;--card:#ffffff;--nav:rgba(255,255,255,.92);--tx:#121214;--g:#5f6168;--line:#e2e2dc;--field:#ffffff;
      --sh:0 1px 2px rgba(16,16,20,.05),0 6px 20px rgba(16,16,20,.06);--sh2:0 2px 4px rgba(16,16,20,.06),0 12px 30px rgba(16,16,20,.1);--r:14px
    }
    :root[data-theme=dark]{
      --yt:rgba(255,201,0,.13);--yl:rgba(255,201,0,.38);
      --bg:#0d0d0e;--bg2:#141416;--card:#171719;--nav:rgba(15,15,16,.92);--tx:#f3f3f1;--g:#a1a3aa;--line:#2a2a2e;--field:#0f0f11;
      --sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);--sh2:0 2px 4px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.45)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Poppins','Noto Sans Sinhala',system-ui,sans-serif;font-size:14px;line-height:1.55;color:var(--tx);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
    .nav{position:sticky;top:0;z-index:30;background:var(--nav);backdrop-filter:saturate(160%) blur(8px);border-bottom:1px solid var(--line)}
    .nav .in{max-width:1080px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:auto;font-size:16px;color:var(--tx);text-decoration:none}
    .brand em{font-style:normal;color:var(--y2)}
    :root[data-theme=dark] .brand em{color:var(--y)}
    .crest{width:34px;height:34px;border-radius:50%;background:#fff;object-fit:contain}
    .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;display:grid;place-items:center;font-size:14px}
    .btn{background:var(--y);color:#111;border:1px solid transparent;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
    .btn.ghost{background:var(--card);color:var(--tx);border-color:var(--line)}
    .btn:disabled{opacity:.6;cursor:wait}
    .wrap{max-width:920px;width:100%;margin:22px auto;padding:0 16px;flex:1;display:flex;flex-direction:column}
    .toprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .title{display:flex;align-items:center;gap:10px;margin:0;font-size:22px;font-weight:700}
    .title i{color:var(--y2)}
    :root[data-theme=dark] .title i{color:var(--y)}
    .sub{color:var(--g);margin:4px 0 0;font-size:13px}
    .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
    .seg button{border:0;background:none;color:var(--g);font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
    .seg button.on{background:var(--y);color:#111}
    .chatbox{flex:1;min-height:480px;max-height:calc(100vh - 230px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
    .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
    .msg{max-width:82%;padding:12px 15px;border-radius:14px;font-size:14px;line-height:1.6;word-break:break-word}
    .msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--tx)}
    .msg.usr{align-self:flex-end;background:var(--y);color:#111;font-weight:500}
    .hl{background:var(--yt);color:var(--y2);font-weight:700;padding:1px 6px;border-radius:5px}
    :root[data-theme=dark] .hl{color:var(--y)}
    .codechip{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg2);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
    .chips{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);background:var(--card)}
    .chip{font:inherit;font-size:12px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);cursor:pointer;text-align:left}
    .chip:hover{border-color:var(--yl);background:var(--yt)}
    .composer{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:var(--card)}
    .composer input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:var(--field);color:var(--tx)}
    .composer input:focus{outline:none;border-color:var(--y)}
  </style>
</head>
<body>
  <div class="nav">
    <div class="in">
      <a class="brand" href="index.html">
        <img class="crest" src="logos/favicon.svg" alt="MCG ICT Grid" onerror="this.remove()">
        <span>MCG <em>ICT Grid</em></span>
      </a>
      <button class="icon-btn" type="button" id="themeBtn" aria-label="Switch theme"><i class="fa-solid fa-moon" id="themeIc"></i></button>
      <a class="btn ghost" id="backLink" href="index.html"><i class="fa-solid fa-arrow-left"></i> <span>Home</span></a>
    </div>
  </div>

  <div class="wrap">
    <div class="toprow">
      <div>
        <h1 class="title"><i class="fa-solid fa-robot"></i> <span id="pageTitle">AI Student Helper</span></h1>
        <p class="sub" id="pageSub">Ask anything about homework, quizzes, marks, or Grade 6–8 ICT lessons.</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="seg" role="group" aria-label="AI language">
          <button type="button" id="btnSi" class="on">සිංහල</button>
          <button type="button" id="btnEn">English</button>
        </div>
        <button type="button" class="btn ghost" id="clearBtn"><i class="fa-solid fa-rotate-left"></i> <span id="clearLbl">Clear</span></button>
      </div>
    </div>

    <div class="chatbox">
      <div class="msgs" id="msgs"></div>
      <div class="chips" id="chips"></div>
      <form class="composer" id="form">
        <input id="inp" type="text" maxlength="1000" placeholder="ඔබේ ප්‍රශ්නය මෙහි ලියන්න..." autocomplete="off">
        <button class="btn" id="sendBtn" type="submit"><i class="fa-solid fa-paper-plane"></i> <span id="sendLbl">යවන්න</span></button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      var lang = 'si';
      try { if (localStorage.getItem('lms_lang') === 'en') lang = 'en'; } catch (e) {}
      try {
        var me = JSON.parse(localStorage.getItem('lms_user') || 'null');
        if (me) {
          var bl = document.getElementById('backLink');
          bl.href = me.role === 'teacher' ? 'admin.html' : 'home.html';
          bl.querySelector('span').textContent = 'Dashboard';
        }
      } catch (e) {}

      function syncThemeIc() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.getElementById('themeIc').className = 'fa-solid ' + (dark ? 'fa-sun' : 'fa-moon');
      }
      syncThemeIc();
      document.getElementById('themeBtn').onclick = function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('lms_theme', next); } catch (e) {}
        syncThemeIc();
      };

      var COPY = {
        si: {
          title: 'AI ශිෂ්‍ය සහායක',
          sub: 'Homework, Quizzes, ලකුණු හෝ 6–8 ශ්‍රේණි ICT පාඩම් ගැන ඕනෑම ප්‍රශ්නයක් අසන්න.',
          placeholder: 'ඔබේ ගැටළුව හෝ ICT ප්‍රශ්නය මෙහි ලියන්න...',
          send: 'යවන්න',
          clear: 'අලුතින්',
          thinking: 'පිළිතුර සකසමින්...',
          welcome: 'ආයුබෝවන්! මම **MCG ICT Grid** AI සහායක. Homework upload කරන හැටි, Polls & Quizzes, ලකුණු බලන හැටි හෝ ICT පාඩම් ගැන මගෙන් අහන්න.',
          starters: [
            'Homework එකට photo upload කරන්නේ කොහොමද?',
            'Quiz ලකුණු බලන්නේ කොහොමද?',
            '6 ශ්‍රේණියේ Input Devices මොනවාද?',
            'Class Chat එකේ නීති මොනවාද?'
          ]
        },
        en: {
          title: 'AI Student Helper',
          sub: 'Ask anything about homework, quizzes, marks, or Grade 6–8 ICT lessons.',
          placeholder: 'Type your question or ICT topic here...',
          send: 'Send',
          clear: 'Reset',
          thinking: 'Drafting reply...',
          welcome: 'Hello! I am the **MCG ICT Grid** AI Helper. Ask me how to submit homework, check quiz marks, or explain Grade 6–8 ICT concepts.',
          starters: [
            'How do I upload photos for homework?',
            'Where can I see my quiz marks?',
            'Explain Input vs Output devices simply',
            'Why are links blocked in Class Chat?'
          ]
        }
      };

      var msgsEl = document.getElementById('msgs');
      var chipsEl = document.getElementById('chips');
      var inp = document.getElementById('inp');
      var sendBtn = document.getElementById('sendBtn');
      var history = [];

      function renderRich(el, raw) {
        while (el.firstChild) el.removeChild(el.firstChild);
        var lines = String(raw || '').split('\n');
        var re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
        lines.forEach(function (line, i) {
          if (i > 0) el.appendChild(document.createElement('br'));
          var clean = line.replace(/^\s*[-*]\s+/, '• ');
          clean.split(re).forEach(function (p) {
            if (p.indexOf('**') === 0 && p.lastIndexOf('**') === p.length - 2 && p.length > 4) {
              var s = document.createElement('strong');
              s.className = 'hl';
              s.textContent = p.slice(2, -2);
              el.appendChild(s);
            } else if (p.indexOf('`') === 0 && p.lastIndexOf('`') === p.length - 1 && p.length > 2) {
              var c = document.createElement('code');
              c.className = 'codechip';
              c.textContent = p.slice(1, -1);
              el.appendChild(c);
            } else if (p) {
              el.appendChild(document.createTextNode(p));
            }
          });
        });
      }

      function addBubble(role, text) {
        var b = document.createElement('div');
        b.className = 'msg ' + (role === 'user' ? 'usr' : 'bot');
        if (role === 'assistant') renderRich(b, text);
        else b.textContent = text;
        msgsEl.appendChild(b);
        msgsEl.scrollTop = msgsEl.scrollHeight;
        return b;
      }

      function applyLang(reset) {
        var c = COPY[lang];
        document.getElementById('btnSi').classList.toggle('on', lang === 'si');
        document.getElementById('btnEn').classList.toggle('on', lang === 'en');
        document.getElementById('pageTitle').textContent = c.title;
        document.getElementById('pageSub').textContent = c.sub;
        document.getElementById('sendLbl').textContent = c.send;
        document.getElementById('clearLbl').textContent = c.clear;
        inp.placeholder = c.placeholder;

        if (reset || history.length === 0) {
          while (msgsEl.firstChild) msgsEl.removeChild(msgsEl.firstChild);
          history = [{ role: 'assistant', text: c.welcome }];
          addBubble('assistant', c.welcome);
          chipsEl.style.display = 'flex';
        }
        while (chipsEl.firstChild) chipsEl.removeChild(chipsEl.firstChild);
        c.starters.forEach(function (q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'chip';
          b.textContent = q;
          b.onclick = function () { ask(q); };
          chipsEl.appendChild(b);
        });
      }

      applyLang(true);

      document.getElementById('btnSi').onclick = function () { lang = 'si'; applyLang(history.length <= 1); };
      document.getElementById('btnEn').onclick = function () { lang = 'en'; applyLang(history.length <= 1); };
      document.getElementById('clearBtn').onclick = function () { applyLang(true); };

      async function ask(raw) {
        var q = String(raw || '').trim();
        if (!q || sendBtn.disabled) return;
        chipsEl.style.display = 'none';
        history.push({ role: 'user', text: q });
        addBubble('user', q);
        inp.value = '';
        sendBtn.disabled = true;
        var wait = addBubble('assistant', COPY[lang].thinking);
        try {
          var r = await fetch('/api/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: 'chat', replyLang: lang, messages: history })
          });
          var j = await r.json();
          if (!r.ok) throw new Error(j.error || 'Error');
          renderRich(wait, j.reply);
          history.push({ role: 'assistant', text: j.reply });
        } catch (e) {
          wait.textContent = e.message || 'Connection error';
        } finally {
          sendBtn.disabled = false;
          msgsEl.scrollTop = msgsEl.scrollHeight;
        }
      }

      document.getElementById('form').onsubmit = function (e) {
        e.preventDefault();
        ask(inp.value);
      };
    })();
  </script>
</body>
</html>
