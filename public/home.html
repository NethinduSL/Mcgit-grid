<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffc900">
<title>Homework · MCG IT Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc900'/%3E%3Crect x='12' y='12' width='18' height='18' rx='3' fill='%23111'/%3E%3Crect x='34' y='12' width='18' height='18' rx='3' fill='%23111' opacity='.35'/%3E%3Crect x='12' y='34' width='18' height='18' rx='3' fill='%23111' opacity='.35'/%3E%3Crect x='34' y='34' width='18' height='18' rx='3' fill='%23111'/%3E%3C/svg%3E" type="image/svg+xml">
<script src="app.js"></script>
</head>
<body>
<div class="nav" id="nav"></div>
<div class="wrap">
  <h1 class="title" id="hi"></h1><p class="sub">Your homework and marks</p>
  <div class="stats" id="stats"></div>
  <div class="seg" id="seg"></div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const FILTERS = [['all', 'All'], ['pending', 'Pending'], ['done', 'Submitted'], ['graded', 'Graded']];
let data = { homeworks: [], mine: [] }, filter = 'all', pickers = {}, openIds = new Set();
if (guard('student')) {
  renderNav('home');
  $('hi').innerHTML = 'Hi, ' + esc((me.name || '').split(' ')[0] || 'student') + ' 👋';
  $('list').innerHTML = skeleton(3);
  load();
}
const target = h => !h.targets || !h.targets.length ? 'All classes' : h.targets.map(t => t.includes('-') ? 'Grade ' + t : 'Grade ' + t + ' (all)').join(', ');
async function load() {
  try { data = await api('homeworks'); draw(); }
  catch (e) { $('list').innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>' + esc(e.message) + '</div>'; }
}
function draw() {
  const { homeworks, mine } = data;
  const sub = Object.fromEntries(mine.map(s => [s.homeworkId, s]));
  const done = homeworks.filter(h => sub[h.id]).length, graded = mine.filter(s => s.marks != null).length;
  $('stats').innerHTML = [
    ['fa-book', homeworks.length, 'Total'], ['fa-circle-check', done, 'Submitted'],
    ['fa-hourglass-half', homeworks.length - done, 'Pending'], ['fa-star', graded, 'Graded']
  ].map(s => `<div class="stat"><i class="fa-solid ${s[0]}"></i><div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join('');
  $('seg').innerHTML = FILTERS.map(f => `<button type="button" class="${f[0] === filter ? 'on' : ''}" onclick="setF('${f[0]}')">${f[1]}</button>`).join('');
  const shown = homeworks.filter(h => {
    const s = sub[h.id];
    return filter === 'all' || (filter === 'pending' && !s) || (filter === 'done' && s) || (filter === 'graded' && s && s.marks != null);
  });
  pickers = {};
  $('list').innerHTML = shown.map(h => {
    const s = sub[h.id], late = !s && h.due && new Date(h.due + 'T23:59:59') < new Date();
    return `<div class="card hw"><div class="ic"><i class="fa-solid fa-laptop-code"></i></div><div class="body">
      <h3>${esc(h.title)}</h3>
      <div class="meta"><span><i class="fa-regular fa-calendar"></i> Due ${fmt(h.due)}</span>
        <span class="badge"><i class="fa-solid fa-people-group"></i> ${esc(target(h))}</span>
        ${h.total ? `<span class="badge">${h.total} marks</span>` : ''}
        <span class="badge ${s ? 'ok' : late ? 'late' : 'y'}">${s ? 'Submitted' : late ? 'Overdue' : 'Pending'}</span></div>
      <p>${esc(h.description)}</p>
      ${gallery(h.images)}
      ${s && s.marks != null ? `<div class="mark"><i class="fa-solid fa-star"></i> ${s.marks}${h.total ? ' / ' + h.total : ''} marks</div>${s.feedback ? `<p><i class="fa-regular fa-comment"></i> ${esc(s.feedback)}</p>` : ''}` : ''}
      <button class="btn sm ${s ? 'ghost' : ''}" type="button" onclick="tog('${h.id}')"><i class="fa-solid fa-paper-plane"></i> ${s ? 'Edit submission' : 'Submit'}</button>
      <div class="panel ${openIds.has(h.id) ? 'open' : ''}" id="p-${h.id}">
        <div class="field"><label>Your answer</label><textarea id="a-${h.id}" rows="4">${esc(s?.answer)}</textarea></div>
        <div class="field"><label>Link (Google Drive, etc.)</label><input id="l-${h.id}" value="${esc(s?.link)}" placeholder="https://"></div>
        <div class="field"><label>Images (up to 3)</label><div id="pk-${h.id}"></div></div>
        <button class="btn" type="button" id="b-${h.id}" onclick="send('${h.id}')"><i class="fa-solid fa-check"></i> Save submission</button>
      </div></div></div>`;
  }).join('') || '<div class="empty"><i class="fa-regular fa-folder-open"></i>No homework here</div>';
  hydrate($('list'));
  openIds.forEach(id => mount(id));
}
function setF(f) { filter = f; draw(); }
function mount(id) {
  if (pickers[id] || !$('pk-' + id)) return;
  const s = data.mine.find(x => x.homeworkId === id);
  pickers[id] = makePicker($('pk-' + id), { max: 3, existing: (s && s.images) || [] });
}
function tog(id) {
  const p = $('p-' + id); p.classList.toggle('open');
  if (p.classList.contains('open')) { openIds.add(id); mount(id); } else openIds.delete(id);
}
async function send(id) {
  const btn = $('b-' + id);
  busy(btn, true, pickers[id] && pickers[id].count() ? 'Uploading' : 'Saving');
  try {
    const images = pickers[id] ? await pickers[id].upload() : [];
    await api('submit', { homeworkId: id, answer: $('a-' + id).value, link: $('l-' + id).value, images });
    toast('Submitted ✔'); openIds.delete(id); await load();
  } catch (e) { toast(e.message, true); busy(btn, false); }
}
</script></body></html>
