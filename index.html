<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* MCG IT Grid - glassmorphism theme */
:root{--y:#ffc900;--k:#0b0b0c;--g:rgba(255,255,255,.62);--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);--red:#ff7b86;--green:#5be08f}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font-family:'Poppins',sans-serif;font-size:14px;color:#fff;min-height:100vh;
  background:
    radial-gradient(620px 420px at 8% 0%,rgba(255,201,0,.34),transparent 62%),
    radial-gradient(520px 520px at 100% 22%,rgba(255,140,0,.18),transparent 62%),
    radial-gradient(760px 520px at 45% 112%,rgba(255,201,0,.22),transparent 62%),#0b0b0c;
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%)}
a{color:var(--y)}
::selection{background:var(--y);color:#000}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#ffffff30;border-radius:10px}

/* glass surface */
.card,.stat,.sublist,.authbox,.nav{-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.card,.stat{background:var(--glass);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.14);animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.stat,.sublist,.nav,.authbox{background:rgba(28,28,30,.94)}}

/* logo */
.glogo{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;width:36px;height:36px;padding:6px;border-radius:11px;background:var(--y);flex:none;box-shadow:0 0 18px rgba(255,201,0,.45)}
.glogo b{background:#111;border-radius:2px}.glogo b:nth-child(2),.glogo b:nth-child(3){opacity:.3}
.glogo.lg{width:68px;height:68px;padding:12px;gap:5px;border-radius:20px}
.glogo.lg b{border-radius:4px}

/* nav */
.nav{background:rgba(12,12,13,.6);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(255,201,0,.35)}
.nav .in{max-width:1000px;margin:auto;display:flex;align-items:center;gap:6px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:auto;font-size:16px;letter-spacing:.2px}
.brand em{font-style:normal;color:var(--y)}
.nav .link{color:#e6e6e6;text-decoration:none;padding:8px 14px;border-radius:10px;font:500 13px Poppins;display:flex;gap:8px;align-items:center;background:none;border:1px solid transparent;cursor:pointer;transition:.2s}
.nav .link:hover{background:var(--glass2);border-color:var(--line)}
.nav .link.on{background:var(--y);color:#111;font-weight:600;box-shadow:0 0 18px rgba(255,201,0,.35)}

/* layout */
.wrap{max-width:1000px;margin:26px auto;padding:0 16px;position:relative;z-index:1}
.title{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:24px;font-weight:700}
.title i{color:var(--y)}
.sub{color:var(--g);margin:0 0 22px}
.card{padding:18px;margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:16px;display:flex;gap:10px;align-items:center}
.card h2 i{color:#111;background:var(--y);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{padding:14px;display:flex;gap:12px;align-items:center}
.stat i{width:44px;height:44px;border-radius:13px;background:var(--y);color:#111;display:grid;place-items:center;font-size:18px;box-shadow:0 0 16px rgba(255,201,0,.35)}
.stat b{font-size:24px;display:block;line-height:1.1}.stat span{font-size:12px;color:var(--g)}

/* forms */
label{font-size:12px;font-weight:600;color:rgba(255,255,255,.85);display:block;margin-bottom:5px}
.field{margin-bottom:12px}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;color:#fff;background:rgba(255,255,255,.06);transition:.2s}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.4)}
input:focus,textarea:focus{outline:none;border-color:var(--y);background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(255,201,0,.25)}
input:disabled{opacity:.55;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:var(--y);color:#111;border:1px solid transparent;padding:10px 18px;border-radius:12px;font:600 13px Poppins;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:.2s;box-shadow:0 4px 18px rgba(255,201,0,.28)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(255,201,0,.42)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.dark,.btn.ghost{background:var(--glass2);color:#fff;border-color:var(--line);box-shadow:none}
.btn.dark:hover,.btn.ghost:hover{background:rgba(255,255,255,.2);box-shadow:none}
.btn.danger{background:rgba(255,90,100,.14);color:var(--red);border-color:rgba(255,90,100,.35);box-shadow:none}
.btn.danger:hover{background:rgba(255,90,100,.25);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:12px}

/* homework */
.hw{display:flex;gap:14px}
.hw .ic{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,201,0,.14);color:var(--y);border:1px solid rgba(255,201,0,.38);display:grid;place-items:center;font-size:18px}
.hw .body{flex:1;min-width:0}
.hw h3{margin:0 0 5px;font-size:15px}
.hw p{margin:8px 0;color:rgba(255,255,255,.8);white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--g)}
.badge{padding:3px 11px;border-radius:20px;font-size:11px;font-weight:600;background:var(--glass2);border:1px solid var(--line);color:#fff;display:inline-flex;gap:6px;align-items:center}
.badge.ok{background:rgba(91,224,143,.15);color:var(--green);border-color:rgba(91,224,143,.4)}
.badge.late{background:rgba(255,123,134,.15);color:var(--red);border-color:rgba(255,123,134,.4)}
.badge.y{background:var(--y);color:#111;border-color:transparent}
.panel{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}.panel.open{display:block}
.mark{background:rgba(255,201,0,.15);color:var(--y);border:1px solid rgba(255,201,0,.4);border-radius:12px;padding:7px 13px;display:inline-flex;gap:8px;align-items:center;margin:6px 0;font-weight:600}
.sublist{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:rgba(0,0,0,.25)}
.sublist .who{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:6px}
.sublist .who i{color:var(--y)}
.grade-row{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center}
.empty{text-align:center;color:var(--g);padding:34px}.empty i{font-size:34px;color:rgba(255,255,255,.25);display:block;margin-bottom:8px}

/* profile */
.avatar{width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#ffe066,var(--y) 55%,#ff9f00);color:#111;display:grid;place-items:center;font-size:30px;font-weight:700;border:3px solid rgba(255,255,255,.35);box-shadow:0 0 28px rgba(255,201,0,.4)}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead h2{margin:0 0 6px;font-size:20px;display:block}

/* toast + footer */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(15,15,16,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;padding:12px 18px;border-radius:14px;border:1px solid var(--line);border-left:4px solid var(--y);z-index:50;font-size:13px;display:none;max-width:90vw}
.toast.bad{border-left-color:var(--red)}
.foot{text-align:center;color:var(--g);font-size:12px;padding:10px 16px 30px;position:relative;z-index:1}
.foot b{color:var(--y);font-weight:600}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;z-index:1}
.authbox{display:grid;grid-template-columns:1.05fr 1fr;width:100%;max-width:940px;border-radius:28px;overflow:hidden;background:var(--glass);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.16);animation:up .55s ease both}
.authbox .left{padding:48px 40px;background:linear-gradient(160deg,rgba(255,201,0,.2),rgba(255,201,0,.02) 60%);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.authbox .left h1{font-size:32px;margin:18px 0 8px;line-height:1.15}.authbox .left h1 em{font-style:normal;color:var(--y)}
.authbox .left p{color:rgba(255,255,255,.7);margin:0;max-width:320px}
.authbox .left ul{list-style:none;padding:0;margin:26px 0 0}
.authbox .left li{margin:10px 0;display:flex;gap:12px;align-items:center;color:#eee}
.authbox .left li i{width:34px;height:34px;border-radius:10px;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;color:var(--y);font-size:14px}
.authbox .right{padding:40px;background:rgba(0,0,0,.2)}
.authbox h2{font-size:24px;margin:0 0 4px}
.tabs{display:flex;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:4px;margin:18px 0}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font:600 13px Poppins;cursor:pointer;color:var(--g);transition:.2s}
.tabs button.on{background:var(--y);color:#111}
.err{color:var(--red);font-size:13px;min-height:20px;margin:8px 0}

@media(max-width:760px){
  .authbox{grid-template-columns:1fr}.authbox .left{padding:28px 24px;border-right:0;border-bottom:1px solid var(--line)}.authbox .left ul{display:none}.authbox .right{padding:26px 22px}
  .nav .link span{display:none}.nav .link{padding:9px 12px}.row{grid-template-columns:1fr}.grade-row{grid-template-columns:1fr}.hw .ic{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc900'/%3E%3Crect x='12' y='12' width='18' height='18' rx='3' fill='%23111'/%3E%3Crect x='34' y='12' width='18' height='18' rx='3' fill='%23111' opacity='.35'/%3E%3Crect x='12' y='34' width='18' height='18' rx='3' fill='%23111' opacity='.35'/%3E%3Crect x='34' y='34' width='18' height='18' rx='3' fill='%23111'/%3E%3C/svg%3E" type="image/svg+xml">
<title>Login · MCG IT Grid</title></head>
<body>
<div class="auth"><div class="authbox">
  <div class="left">
    <span class="glogo lg"><b></b><b></b><b></b><b></b></span>
    <h1>MCG <em>IT Grid</em></h1>
    <p>Your ICT learning space. Get homeworks, submit your work and track your marks in one place.</p>
    <ul>
      <li><i class="fa-solid fa-book-open"></i> View homeworks</li>
      <li><i class="fa-solid fa-paper-plane"></i> Submit online</li>
      <li><i class="fa-solid fa-star"></i> See marks and feedback</li>
    </ul>
  </div>
  <div class="right">
    <form onsubmit="doAuth(event)">
      <h2 id="h">Welcome back</h2>
      <div style="color:var(--g)">Please enter your details</div>
      <div class="tabs"><button type="button" id="t1" class="on" onclick="mode(false)">Login</button><button type="button" id="t2" onclick="mode(true)">Register</button></div>
      <div id="regf" hidden>
        <div class="field"><label>Full name</label><input id="name" autocomplete="name"></div>
        <div class="field"><label>Grade / Class</label><input id="grade" placeholder="e.g. 11-A"></div>
      </div>
      <div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="pw" type="password" required minlength="6" autocomplete="current-password"></div>
      <div class="field" id="codef" hidden><label>Teacher code <small style="font-weight:400;opacity:.7">(teachers only)</small></label><input id="code" autocomplete="off"></div>
      <div class="err" id="err"></div>
      <button class="btn" style="width:100%;justify-content:center" id="go"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    </form>
  </div>
</div></div>
<div class="foot"><b>MCG IT Grid</b> · ICT Learning Management System</div>
<script>
const BRAND = 'MCG IT Grid';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => $(id).value.trim();
const fmt = d => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

let token = localStorage.getItem('lms_token');
let me = JSON.parse(localStorage.getItem('lms_user') || 'null');

async function api(action, body = {}) {
  const r = await fetch('/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: JSON.stringify({ action, ...body })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && token) logout(); throw new Error(j.error || 'Something went wrong'); }
  return j;
}
function saveSession(j) {
  token = j.token || token; me = j.user;
  localStorage.setItem('lms_token', token); localStorage.setItem('lms_user', JSON.stringify(me));
}
function home() { return me && me.role === 'teacher' ? 'admin.html' : 'home.html'; }
function logout() { localStorage.removeItem('lms_token'); localStorage.removeItem('lms_user'); location.href = 'index.html'; }

// call at top of every protected page; role = 'student' | 'teacher' | undefined
function guard(role) {
  if (!token || !me) { location.href = 'index.html'; return false; }
  if (role && me.role !== role) { location.href = home(); return false; }
  return true;
}
function renderNav(active) {
  const links = me.role === 'teacher'
    ? [['admin', 'admin.html', 'fa-chalkboard-user', 'Admin']]
    : [['home', 'home.html', 'fa-house', 'Home']];
  links.push(['profile', 'profile.html', 'fa-user', 'Profile']);
  $('nav').innerHTML = `<div class="in">
    <div class="brand"><span class="glogo"><b></b><b></b><b></b><b></b></span><span>MCG <em>IT Grid</em></span></div>
    ${links.map(l => `<a class="link ${l[0] === active ? 'on' : ''}" href="${l[1]}"><i class="fa-solid ${l[2]}"></i><span>${l[3]}</span></a>`).join('')}
    <button class="link" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button></div>`;
  if (!document.querySelector('.foot')) document.body.insertAdjacentHTML('beforeend', '<div class="foot"><b>MCG IT Grid</b> · ICT Learning Management System</div>');
}
let tt;
function toast(t, bad) {
  const el = $('toast'); el.textContent = t; el.className = 'toast' + (bad ? ' bad' : ''); el.style.display = 'block';
  clearTimeout(tt); tt = setTimeout(() => el.style.display = 'none', 2800);
}

</script>
<script>
if (token && me) location.href = home();
let reg = false;
function mode(r) {
  reg = r; $('regf').hidden = !r; $('codef').hidden = !r;
  $('t1').className = r ? '' : 'on'; $('t2').className = r ? 'on' : '';
  $('h').textContent = r ? 'Create account' : 'Welcome back';
  $('go').innerHTML = r ? '<i class="fa-solid fa-user-plus"></i> Create account' : '<i class="fa-solid fa-right-to-bracket"></i> Login';
  $('pw').autocomplete = r ? 'new-password' : 'current-password';
  $('err').textContent = '';
}
async function doAuth(e) {
  e.preventDefault(); $('err').textContent = ''; $('go').disabled = true;
  try {
    const j = reg
      ? await api('register', { email: val('email'), password: val('pw'), name: val('name'), grade: val('grade'), code: val('code') })
      : await api('login', { email: val('email'), password: val('pw') });
    saveSession(j); location.href = home();
  } catch (x) { $('err').textContent = x.message; $('go').disabled = false; }
}
</script></body></html>
