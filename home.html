<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0b0b0c"><title>Home · MCG IT Grid</title></head>
<body>
<div class="nav" id="nav"></div>
<div class="wrap">
  <h1 class="title" id="hi"></h1><p class="sub">Your homeworks and marks</p>
  <div class="stats" id="stats"></div>
  <div id="list"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Loading...</div></div>
</div>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
<script>
if (guard('student')) { renderNav('home'); $('hi').innerHTML = 'Hi, ' + esc(me.name.split(' ')[0] || 'student') + ' 👋'; load(); }
async function load() {
  try {
    const { homeworks, mine } = await api('homeworks');
    const sub = Object.fromEntries(mine.map(s => [s.homeworkId, s]));
    const done = homeworks.filter(h => sub[h.id]).length, graded = mine.filter(s => s.marks != null).length;
    $('stats').innerHTML = [
      ['fa-book', homeworks.length, 'Total'], ['fa-circle-check', done, 'Submitted'],
      ['fa-hourglass-half', homeworks.length - done, 'Pending'], ['fa-star', graded, 'Graded']
    ].map(s => `<div class="stat"><i class="fa-solid ${s[0]}"></i><div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join('');
    $('list').innerHTML = homeworks.map(h => {
      const s = sub[h.id], late = !s && h.due && new Date(h.due + 'T23:59:59') < new Date();
      return `<div class="card hw"><div class="ic"><i class="fa-solid fa-laptop-code"></i></div><div class="body">
        <h3>${esc(h.title)}</h3>
        <div class="meta"><span><i class="fa-regular fa-calendar"></i> Due ${fmt(h.due)}</span>
          <span class="badge ${s ? 'ok' : late ? 'late' : 'y'}">${s ? 'Submitted' : late ? 'Overdue' : 'Pending'}</span></div>
        <p>${esc(h.description)}</p>
        ${s && s.marks != null ? `<div class="mark"><i class="fa-solid fa-star"></i> ${s.marks} marks</div>${s.feedback ? `<p><i class="fa-regular fa-comment"></i> ${esc(s.feedback)}</p>` : ''}` : ''}
        <button class="btn sm ${s ? 'ghost' : ''}" onclick="tog('${h.id}')"><i class="fa-solid fa-paper-plane"></i> ${s ? 'Edit submission' : 'Submit'}</button>
        <div class="panel" id="p-${h.id}">
          <div class="field"><label>Your answer</label><textarea id="a-${h.id}" rows="4">${esc(s?.answer)}</textarea></div>
          <div class="field"><label>Link (Google Drive, etc.)</label><input id="l-${h.id}" value="${esc(s?.link)}" placeholder="https://"></div>
          <button class="btn" onclick="send('${h.id}')"><i class="fa-solid fa-check"></i> Save submission</button>
        </div></div></div>`;
    }).join('') || '<div class="empty"><i class="fa-regular fa-folder-open"></i>No homeworks yet</div>';
  } catch (e) { $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
const tog = id => $('p-' + id).classList.toggle('open');
async function send(id) {
  try { await api('submit', { homeworkId: id, answer: $('a-' + id).value, link: $('l-' + id).value }); toast('Submitted ✔'); load(); }
  catch (e) { toast(e.message, true); }
}
</script></body></html>
